services:
  - type: web
    name: student-management-app
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm --workspace frontend run build && npm --workspace backend install
    startCommand: npm --workspace backend start
    envVars:
      - key: DATABASE_PATH
        value: ./students.db
      - key: JWT_SECRET
        value: replace-with-your-secret
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: your-smtp-user@example.com
      - key: SMTP_PASS
        value: your-smtp-password
      - key: SMTP_FROM
        value: School Admin <no-reply@example.com>
      - key: SUPPORT_EMAIL
        value: support@example.com
      - key: CLOUDINARY_URL
        value: ''
